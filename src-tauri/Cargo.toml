[package]
name = "companyisland"
version = "1.0.0"
description = "CompanyIsland - a Dynamic Island style date, time and calendar overlay for Windows"
authors = ["CompanyIsland"]
license = "MIT"
edition = "2021"

[lib]
name = "companyisland_lib"
crate-type = ["lib"]

[[bin]]
name = "CompanyIsland"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Foundation_Collections",
  "implement",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
]

[profile.release]
# "s": this is an idle UI overlay, not compute-bound; a smaller binary loads faster.
opt-level = "s"
lto = true
codegen-units = 1
# We rely on catch_unwind around WinRT callbacks and thread entries.
panic = "unwind"
strip = true
