[package]
name = "companyisland"
version = "1.0.10"
description = "CompanyIsland - a Dynamic Island style date, time and calendar overlay for Windows"
authors = ["CompanyIsland"]
license = "MIT"
edition = "2021"

[lib]
name = "companyisland_lib"
crate-type = ["lib"]

[[bin]]
name = "CompanyIsland"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Named pipe server for the Island Center (same major as the copy tauri already pulls in).
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The `implement` macro (IMessageFilter for the Outlook COM worker) expands to `windows_core::` paths.
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security_Authentication_Identity",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Wdk_System_SystemServices",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Foundation_Collections",
  "implement",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
]

[profile.release]
# "s": this is an idle UI overlay, not compute-bound; a smaller binary loads faster.
opt-level = "s"
lto = true
codegen-units = 1
# We rely on catch_unwind around WinRT callbacks and thread entries.
panic = "unwind"
strip = true
